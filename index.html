<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Puzzle Gambar</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            background: linear-gradient(135deg, #1e1b4b, #311042);
            color: #ffffff;
            margin: 0;
            padding: 15px;
        }

        /* PERBAIKAN: Pengatur 5 Logo Berjejer Kecil */
        .logo-group {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
        }

        .logo-group img {
            width: 45px;       /* Ukuran lebar logo kecil */
            height: 45px;      /* Ukuran tinggi logo kecil */
            border-radius: 8px;
            object-fit: cover;
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 2px 5px rgba(0,0,0,0.4);
        }

        h1 { 
            margin: 0 0 15px 0; 
            font-size: 20px; 
            color: #fbbf24; 
        }

        /* Status & Skor */
        .stats-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 15px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.1);
            padding: 8px 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 13px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        /* Papan Puzzle */
        #puzzle-board {
            display: grid;
            gap: 4px;
            width: 300px;
            height: 300px;
            margin: 0 auto;
            background-color: #0f172a;
            padding: 6px;
            border-radius: 12px;
            border: 3px solid #fbbf24;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .tile {
            background-size: 300px 300px;
            background-repeat: no-repeat;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 20px;
            color: rgba(255,255,255,0.8);
            text-shadow: 1px 1px 3px #000;
            user-select: none;
        }

        .empty {
            background: #1e293b !important;
            border: 2px dashed rgba(255,255,255,0.2);
        }

        #message {
            font-size: 15px;
            font-weight: bold;
            color: #4ade80;
            min-height: 24px;
            margin-top: 15px;
        }

        .instructions {
            font-size: 12px;
            color: #94a3b8;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <!-- Wadah 5 Logo (Pastikan nama file sesuai gambar di GitHub kamu) -->
    <div class="logo-group">
        <img src="IMG-20260728-WA0025.jpg" alt="Logo 1">
        <img src="logo2.png" alt="Logo 2">
        <img src="logo3.png" alt="Logo 3">
        <img src="logo4.png" alt="Logo 4">
        <img src="logo5.png" alt="Logo 5">
    </div>

    <!-- Judul Game Cukup 1 Saja -->
    <h1>Puzzle Geser Gambar</h1>

    <div class="stats-container">
        <div class="stat-card">Level: <span id="level-txt" style="color:#4ade80">1 (3x3)</span></div>
        <div class="stat-card">Langkah: <span id="moves-txt" style="color:#fbbf24">0</span></div>
        <div class="stat-card">Skor: <span id="score-txt" style="color:#38bdf8">0</span></div>
    </div>

    <div id="puzzle-board"></div>

    <div id="message">Geser kotak untuk menyusun gambar!</div>

    <p class="instructions">
        <strong>Cara Bermain:</strong> Ketuk/klik kotak di samping area kosong untuk menggesernya.
    </p>

    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(freq, duration) {
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.frequency.value = freq;
                osc.start();
                gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
                osc.stop(audioCtx.currentTime + duration);
            } catch(e) {}
        }

        const images = [
            "https://picsum.photos/id/1018/600/600",
            "https://picsum.photos/id/1015/600/600",
            "https://picsum.photos/id/1025/600/600"
        ];

        let currentLevel = 0;
        let gridSize = 3;
        let tiles = [];
        let moves = 0;
        let score = 0;

        const board = document.getElementById('puzzle-board');

        function initGame() {
            gridSize = 3 + currentLevel;
            board.style.gridTemplateColumns = `repeat(${gridSize}, 1fr)`;
            board.style.gridTemplateRows = `repeat(${gridSize}, 1fr)`;
            
            moves = 0;
            document.getElementById('moves-txt').innerText = moves;
            document.getElementById('level-txt').innerText = `${currentLevel + 1} (${gridSize}x${gridSize})`;
            document.getElementById('message').innerText = "Geser kotak untuk menyusun gambar!";

            tiles = Array.from({length: gridSize * gridSize}, (_, i) => i);
            shuffle(tiles);
            renderBoard();
        }

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function renderBoard() {
            board.innerHTML = '';
            const imgUrl = images[currentLevel % images.length];

            tiles.forEach((tileValue, index) => {
                const tile = document.createElement('div');
                tile.classList.add('tile');

                if (tileValue === gridSize * gridSize - 1) {
                    tile.classList.add('empty');
                } else {
                    const row = Math.floor(tileValue / gridSize);
                    const col = tileValue % gridSize;
                    const percentage = 100 / (gridSize - 1);

                    tile.style.backgroundImage = `url('${imgUrl}')`;
                    tile.style.backgroundPosition = `${col * percentage}% ${row * percentage}%`;
                    tile.style.backgroundSize = `${gridSize * 100}% ${gridSize * 100}%`;
                    tile.innerText = tileValue + 1;
                }

                tile.addEventListener('click', () => moveTile(index));
                board.appendChild(tile);
            });
        }

        function moveTile(index) {
            const emptyIndex = tiles.indexOf(gridSize * gridSize - 1);
            
            const isAdjacent = (
                (Math.abs(index - emptyIndex) === 1 && Math.floor(index / gridSize) === Math.floor(emptyIndex / gridSize)) ||
                Math.abs(index - emptyIndex) === gridSize
            );

            if (isAdjacent) {
                [tiles[index], tiles[emptyIndex]] = [tiles[emptyIndex], tiles[index]];
                moves++;
                document.getElementById('moves-txt').innerText = moves;
                playSound(400, 0.05);
                renderBoard();
                checkWin();
            }
        }

        function checkWin() {
            const isSolved = tiles.every((val, index) => val === index);
            if (isSolved) {
                playSound(600, 0.3);
                score += (1000 - moves * 10);
                if (score < 100) score = 100;
                document.getElementById('score-txt').innerText = score;

                if (currentLevel < 2) {
                    document.getElementById('message').innerText = "🎉 SELAMAT! Lanjut ke Level Berikutnya...";
                    setTimeout(() => {
                        currentLevel++;
                        initGame();
                    }, 2000);
                } else {
                    document.getElementById('message').innerText = "🏆 TAMAT! Kamu Menyelesaikan Semua Puzzle!";
                }
            }
        }

        initGame();
    </script>
</body>
</html>
